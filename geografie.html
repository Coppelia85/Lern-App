<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Europa-Geografie-Trainer mit Karte</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0f4f8; margin: 0; padding: 15px; display: flex; justify-content: center; }
        .container { background: white; width: 100%; max-width: 700px; padding: 20px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); text-align: center; }
        h1 { color: #d69e2e; margin-top: 5px; font-size: 1.4rem; }
        
        /* Karten-Container für saubere Ansicht auf Tablet & Handy */
        .map-container {
            width: 100%;
            max-height: 350px;
            overflow: hidden;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            margin-bottom: 15px;
            background: #cbd5e0;
        }
        .map-container img {
            width: 100%;
            height: auto;
            display: block;
        }

        .question-box { background: #fefcbf; padding: 15px; border-radius: 10px; font-size: 1.1rem; font-weight: bold; margin-bottom: 15px; color: #744210; }
        input[type="text"] { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #cbd5e0; box-sizing: border-box; margin-bottom: 12px; font-size: 1rem; }
        button { background: #d69e2e; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem; }
        button:hover { background: #b7791f; }
        .tip-box { background: #edf2f7; padding: 10px; border-radius: 6px; font-size: 0.9rem; color: #4a5568; margin-bottom: 12px; text-align: left; }
    </style>
</head>
<body>

<div class="container">
    <div style="text-align: left;"><a href="index.html">⬅ Zurück zum Menü</a></div>
    <h1>🌍 Europa-Geografie mit Karte</h1>

    <!-- DIE KARTE: Hier wird das Bild eingebunden -->
    <div class="map-container">
        <!-- Ersetze 'europa_karte.png' durch den Dateinamen deines Kartenbildes im Ordner -->
        <img id="geo-map-img" src="europa_karte.png" alt="Stumme Europakarte mit Nummern" onerror="this.src='https://upload.wikimedia.org/wikipedia/commons/thumb/b/b5/Europe_blank_map.png/800px-Europe_blank_map.png'">
    </div>

    <div class="question-box" id="geo-question">Frage lädt...</div>
    <div id="geo-tip" class="tip-box"></div>
    <input type="text" id="geo-answer" placeholder="Antwort eingeben (z.B. Hauptstadt oder Land)..." onkeypress="if(event.key === 'Y' || event.key === 'Enter') checkGeoAnswer()">
    <button onclick="checkGeoAnswer()">Antwort prüfen</button>
    <p id="geo-feedback" style="font-weight: bold; margin-top: 12px;"></p>
</div>

<script src="daten.js"></script>
<script>
    let geoIndex = 0;

    function loadGeoQuestion() {
        if (geoIndex >= europaDatenbank.length) {
            document.getElementById("geo-question").textContent = "🎉 Genial! Alle Geografie-Fragen erfolgreich gemeistert!";
            document.getElementById("geo-tip").style.display = "none";
            document.getElementById("geo-answer").style.display = "none";
            document.querySelector("button").style.display = "none";
            return;
        }
        let item = europaDatenbank[geoIndex];
        document.getElementById("geo-question").textContent = `Schau auf die Karte: Welche Hauptstadt gehört zu Land Nr. ${item.nr} (${item.region})?`;
        document.getElementById("geo-tip").innerHTML = `💡 <b>Tipp:</b> ${item.tipp}`;
        document.getElementById("geo-tip").style.display = "block";
        document.getElementById("geo-answer").value = "";
        document.getElementById("geo-feedback").textContent = "";
    }

    function checkGeoAnswer() {
        let item = europaDatenbank[geoIndex];
        let userAnswer = document.getElementById("geo-answer").value.trim().toLowerCase();
        let correctAnswer = item.hauptstadt.toLowerCase();

        if (userAnswer === correctAnswer || correctAnswer.includes(userAnswer)) {
            document.getElementById("geo-feedback").style.color = "green";
            document.getElementById("geo-feedback").textContent = "Richtig! Stark gemacht! 🌟";

            let user = localStorage.getItem("activeUser") || "Gast";
            let count = parseInt(localStorage.getItem(`stats_geo_${user}`) || 0) + 1;
            localStorage.setItem(`stats_geo_${user}`, count);

            setTimeout(() => {
                geoIndex++;
                loadGeoQuestion();
            }, 1200);
        } else {
            document.getElementById("geo-feedback").style.color = "red";
            document.getElementById("geo-feedback").textContent = `Leider falsch. Richtig wäre: ${item.hauptstadt}`;
        }
    }

    loadGeoQuestion();
</script>

</body>
</html>
