<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Europa-Geografie Prüfungstrainer</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0f4f8; margin: 0; padding: 10px; display: flex; justify-content: center; }
        .container { background: white; width: 100%; max-width: 750px; padding: 15px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); text-align: center; box-sizing: border-box; }
        h1 { color: #d69e2e; margin-top: 5px; font-size: 1.3rem; }
        
        .setup-box { background: #ebf8ff; padding: 15px; border-radius: 12px; margin-bottom: 15px; text-align: left; }
        .setup-group { margin-bottom: 10px; }
        label { display: block; font-weight: 600; margin-bottom: 4px; font-size: 0.85rem; color: #2b6cb0; }
        select { width: 100%; padding: 8px; border-radius: 8px; border: 1px solid #cbd5e0; box-sizing: border-box; }

        .map-wrapper {
            position: relative;
            width: 100%;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            margin-bottom: 12px;
            overflow: hidden;
            background: #cbd5e0;
            display: none;
        }
        .map-wrapper img { width: 100%; height: auto; display: block; }

        .map-skull-btn {
            position: absolute;
            left: 72%;
            top: 32%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid #e53e3e;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            font-size: 1rem;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
            z-index: 20;
        }

        .stats-bar { font-size: 0.9rem; color: #4a5568; margin-bottom: 8px; font-weight: bold; display: flex; justify-content: space-between; background: #edf2f7; padding: 6px 10px; border-radius: 6px; }
        .question-box { background: #fefcbf; padding: 12px; border-radius: 10px; font-size: 1rem; font-weight: bold; margin-bottom: 12px; color: #744210; display: none; }
        
        .input-row { display: flex; gap: 8px; margin-bottom: 10px; align-items: center; display: none; }
        input[type="text"] { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #cbd5e0; font-size: 1rem; box-sizing: border-box; }
        
        .bulb-btn {
            background: white; border: 2px solid #d69e2e; border-radius: 8px; width: 48px; height: 48px;
            font-size: 1.3rem; cursor: pointer; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); flex-shrink: 0;
        }

        .mc-grid { display: grid; gap: 8px; margin-bottom: 12px; display: none; }
        .mc-btn { background: white; border: 2px solid #cbd5e0; padding: 10px; border-radius: 8px; font-size: 0.95rem; cursor: pointer; font-weight: 500; text-align: left; }

        .action-btn { background: #d69e2e; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem; margin-top: 5px; }
        .next-btn { background: #3182ce; display: none; }
        .tip-box { background: #fffaf0; border: 1px dashed #d69e2e; padding: 10px; border-radius: 8px; font-size: 0.9rem; color: #744210; margin-bottom: 10px; text-align: left; display: none; }
        
        .admin-box { background: #edf2f7; padding: 12px; border-radius: 8px; margin-top: 15px; font-size: 0.85rem; text-align: left; display: none; }
    </style>
</head>
<body>

<div class="container">
    <div style="text-align: left;"><a href="index.html">⬅ Zurück zum Menü</a></div>
    <h1>🌍 Europa-Geografie Prüfungstrainer</h1>

    <div id="setup-screen" class="setup-box">
        <h3>Prüfungsvorbereitung konfigurieren:</h3>
        
        <div class="setup-group">
            <label>Schwierigkeitsstufe & Modus:</label>
            <select id="difficulty-level">
                <option value="1">Stufe 1: Multiple Choice</option>
                <option value="2" selected>Stufe 2: Texteingabe</option>
                <option value="3">Stufe 3: Experten-Modus</option>
            </select>
        </div>

               <div class="setup-group">
            <label>Themenbereich:</label>
            <select id="train-topic">
                <option value="europa_mix">Städte & Länder</option>
                <option value="nachlaender">Nachbarländer von Deutschland</option>
                <option value="fluesse">Flüsse in Europa</option>
                <option value="gebirge">Gebirge in Europa</option>
                <option value="meere">Meere & Ozeane</option>
                <option value="verdichtung">Verdichtungsräume & Ballungsgebiete</option>
            </select>
        </div>


        <div class="setup-group">
            <label>Anzahl der Fragen:</label>
            <select id="question-limit">
                <option value="5">5 Fragen</option>
                <option value="10" selected>10 Fragen</option>
                <option value="all">Alle verfügbaren Fragen</option>
            </select>
        </div>

        <button class="action-btn" onclick="startTraining()">Training starten 🚀</button>

        <!-- Nur für Rolle Chef sichtbarer Bereich -->
        <div class="admin-box" id="chef-admin-box">
            <b>🔒 Eltern-Statistik (Chef):</b><br>
            <button onclick="exportCSVStats()" style="margin-top:6px; padding:6px 10px; background:#2b6cb0; color:white; border:none; border-radius:4px; cursor:pointer;">Statistik als Excel/CSV exportieren 📊</button>
        </div>
    </div>

    <div class="stats-bar" id="stats-bar" style="display: none;">
        <span>Frage <span id="current-q-num">1</span> von <span id="total-q-num">0</span></span>
        <span>Kategorie: <span id="current-cat-display">Land/Stadt</span></span>
    </div>

    <div class="map-wrapper" id="map-wrapper">
        <img id="geo-map-img" src="regionen_pin_europa.png" alt="Europakarte" onerror="this.src='https://upload.wikimedia.org/wikipedia/commons/thumb/b/b5/Europe_blank_map.png/800px-Europe_blank_map.png'">
        <button class="map-skull-btn" id="russland-skull" onclick="endSessionEarly()" title="Notaus">☠️</button>
    </div>

    <div class="question-box" id="geo-question">
        <span id="question-text">Fragetext</span>
    </div>
    
    <div id="geo-tip" class="tip-box"></div>

    <div class="input-row" id="input-row">
        <input type="text" id="geo-answer" placeholder="Antwort eingeben..." onkeypress="if(event.key === 'Enter') checkAnswer()">
        <button class="bulb-btn" onclick="showNextTip()" title="Tipp anzeigen">💡</button>
    </div>

    <button class="action-btn" id="check-btn" style="display: none;" onclick="checkAnswer()">Antwort prüfen</button>
    <button class="action-btn next-btn" id="next-btn" onclick="proceedNext()">Weiter zur nächsten Frage ➡️</button>

    <div class="mc-grid" id="mc-container"></div>
    <p id="geo-feedback" style="font-weight: bold; margin-top: 10px;"></p>
</div>

<script src="daten.js"></script>
<script>
    let activeQuestions = [];
    let currentIndex = 0;
    let currentActiveLevel = 2;
    let awaitingNext = false;

    let sessionStats = {
        "Städte & Länder": { total: 0, correct: 0 },
        "Nachbarländer": { total: 0, correct: 0 },
        "Flüsse": { total: 0, correct: 0 },
        "Gebirge": { total: 0, correct: 0 },
        "Meere": { total: 0, correct: 0 },
        "Verdichtungsräume": { total: 0, correct: 0 }
    };

    // Prüfen, ob eingemeldeter User die Rolle "Chef" hat
    window.addEventListener("DOMContentLoaded", () => {
        let activeUser = localStorage.getItem("activeUser");
        if (activeUser && typeof userConfig !== 'undefined' && userConfig[activeUser]) {
            if (userConfig[activeUser].rolle === "Chef") {
                document.getElementById("chef-admin-box").style.display = "block";
            }
        }
    });

    function startTraining() {
        currentActiveLevel = parseInt(document.getElementById("difficulty-level").value);
        let topicKey = document.getElementById("train-topic").value;
        let limitVal = document.getElementById("question-limit").value;

        let generatedPool = [];

        if (topicKey === "europa_mix") {
            europaDatenbank.forEach(item => {
                let r = Math.random();
                let subType = r < 0.35 ? "cap_from_country" : (r < 0.7 ? "country_from_cap" : (r < 0.85 ? "find_number" : "true_false"));
                
                if (subType === "cap_from_country") {
                    generatedPool.push({ cat: "Städte & Länder", prompt: `Was ist die Hauptstadt von ${item.land}?`, answer: item.hauptstadt, item: item });
                } else if (subType === "country_from_cap") {
                    generatedPool.push({ cat: "Städte & Länder", prompt: `Von welchem Land ist ${item.hauptstadt} die Hauptstadt?`, answer: item.land, item: item });
                } else if (subType === "find_number") {
                    generatedPool.push({ cat: "Städte & Länder", prompt: `Suche ${item.land} auf der Karte, welche Nummer trägt es?`, answer: item.nr.toString(), item: item });
                } else {
                    let randomOther = europaDatenbank[Math.floor(Math.random() * europaDatenbank.length)];
                    let wrongCap = randomOther.hauptstadt;
                    generatedPool.push({ cat: "Städte & Länder", prompt: `Ist ${wrongCap} die Hauptstadt von ${item.land}? (Antworte mit Nein und nenne die richtige)`, answer: item.hauptstadt, item: item });
                }
            });
        } else if (topicKey === "nachlaender") {
            nachlaenderDatenbank.forEach(n => {
                generatedPool.push({ cat: "Nachbarländer", prompt: `Nenne ein Nachbarland von Deutschland:`, answer: n.land, item: { land: n.land, tipp: "Grenzt direkt an Deutschland" } });
            });
        } else if (topicKey === "fluesse") {
            fluesseDatenbank.forEach(f => {
                generatedPool.push({ cat: "Flüsse", prompt: `Welcher Fluss fließt: ${f.route}?`, answer: f.name, item: { land: f.name, tipp: f.info } });
            });
        } else if (topicKey === "gebirge") {
            gebirgeDatenbank.forEach(g => {
                generatedPool.push({ cat: "Gebirge", prompt: `Welches Gebirge liegt unter anderem in ${g.laender[0]}?`, answer: g.name, item: { land: g.name, tipp: "Länder: " + g.laender.join(", ") } });
            });
        } else if (topicKey === "meere") {
            meereDatenbank.forEach(m => {
                generatedPool.push({ cat: "Meere", prompt: `Welches Meer liegt hier: ${m.lage}?`, answer: m.name, item: { land: m.name, tipp: "Gewässer in Europa" } });
            });
        } else if (topicKey === "verdichtung") {
            verdichtungsraeumeDatenbank.forEach(v => {
                generatedPool.push({ cat: "Verdichtungsräume", prompt: `Welcher Ballungsraum gehört zu Städten wie ${v.städte[0]}?`, answer: v.name, item: { land: v.name, tipp: "Wirtschafts- und Ballungsraum in " + v.land } });
            });
        }

        generatedPool.sort(() => Math.random() - 0.5);
        let limit = limitVal === "all" ? generatedPool.length : parseInt(limitVal);
        activeQuestions = generatedPool.slice(0, Math.min(limit, generatedPool.length));

        activeQuestions.forEach(q => {
            q.tipPool = [q.item.tipp || "Kein weiterer Tipp verfügbar", `Anfangsbuchstabe: ${q.answer.charAt(0)}`];
            q.tipIndex = 0;
            q.retryCount = 0;
        });

        if (activeQuestions.length === 0) return;

        document.getElementById("setup-screen").style.display = "none";
        document.getElementById("stats-bar").style.display = "flex";
        document.getElementById("map-wrapper").style.display = "block";
        document.getElementById("geo-question").style.display = "block";

        currentIndex = 0;
        awaitingNext = false;
        loadQuestion();
    }

    function loadQuestion() {
        awaitingNext = false;
        document.getElementById("next-btn").style.display = "none";
        document.getElementById("check-btn").style.display = "block";

        let skullBtn = document.getElementById("russland-skull");
        skullBtn.style.display = (Math.random() * 100 <= 4.2) ? "flex" : "none";

        if (currentIndex >= activeQuestions.length) {
            showEndScreen("🎉 Richtig stark! Du hast diese Prüfungsrunde abgeschlossen!");
            return;
        }

        let qData = activeQuestions[currentIndex];
        document.getElementById("current-q-num").textContent = currentIndex + 1;
        document.getElementById("total-q-num").textContent = activeQuestions.length;
        document.getElementById("current-cat-display").textContent = qData.cat;

        let mapImg = document.getElementById("geo-map-img");
        mapImg.src = (currentActiveLevel === 3) ? "Regionen_europa.png" : "regionen_pin_europa.png";

        document.getElementById("question-text").textContent = qData.prompt;
        document.getElementById("geo-tip").style.display = "none";
        document.getElementById("geo-tip").textContent = "";
        document.getElementById("geo-feedback").textContent = "";

        if (currentActiveLevel === 1) {
            document.getElementById("mc-container").style.display = "grid";
            document.getElementById("input-row").style.display = "none";
            document.getElementById("check-btn").style.display = "none";
            renderMultipleChoice(qData);
        } else {
            document.getElementById("mc-container").style.display = "none";
            document.getElementById("input-row").style.display = "flex";
            document.getElementById("check-btn").style.display = "block";
            document.getElementById("geo-answer").value = "";
            document.getElementById("geo-answer").focus();
        }
    }

    function showEndScreen(titleText) {
        document.getElementById("geo-question").style.display = "none";
        document.getElementById("geo-tip").style.display = "none";
        document.getElementById("input-row").style.display = "none";
        document.getElementById("check-btn").style.display = "none";
        document.getElementById("next-btn").style.display = "none";
        document.getElementById("mc-container").style.display = "none";
        document.getElementById("map-wrapper").style.display = "none";
        document.getElementById("stats-bar").style.display = "none";
        
        let container = document.querySelector(".container");
        let endMsg = document.createElement("div");
        endMsg.innerHTML = `<h2>${titleText}</h2><button class='action-btn' onclick='location.reload()'>Neue Runde starten 🔄</button>`;
        container.appendChild(endMsg);
    }

    function endSessionEarly() {
        if (confirm("Runde wirklich vorzeitig beenden?")) {
            showEndScreen("☠️ Runde vorzeitig beendet über das 4,2%-Russland-Easter-Egg!");
        }
    }

    function showNextTip() {
        let qData = activeQuestions[currentIndex];
        let tipBox = document.getElementById("geo-tip");
        if (!qData.tipPool) return;
        tipBox.style.display = "block";
        tipBox.textContent = `💡 Tipp: ${qData.tipPool[qData.tipIndex]}`;
        qData.tipIndex = (qData.tipIndex + 1) % qData.tipPool.length;
    }

        function renderMultipleChoice(qData) {
        const mcContainer = document.getElementById("mc-container");
        mcContainer.innerHTML = "";

        let options = [qData.answer];
        while (options.length < 4) {
            let rndItem = europaDatenbank[Math.floor(Math.random() * europaDatenbank.length)];
            let val = "";
            
            // Wenn nach einer Nummer gesucht wird, nur Nummern als Ablenkung anbieten!
            if (qData.prompt.includes("Nummer trägt es")) {
                val = rndItem.nr.toString();
            } else {
                val = qData.type === "capital" ? rndItem.hauptstadt : rndItem.land;
            }

            if (!options.includes(val)) options.push(val);
        }
        options.sort(() => Math.random() - 0.5);

        options.forEach(opt => {
            let btn = document.createElement("button");
            btn.className = "mc-btn";
            btn.textContent = opt;
            btn.onclick = () => checkAnswer(opt);
            mcContainer.appendChild(btn);
        });
    }


    function normalizeStr(str) {
        return str.toLowerCase()
            .replace(/ä/g, 'a').replace(/ö/g, 'o').replace(/ü/g, 'u')
            .replace(/é/g, 'e').replace(/í/g, 'i').replace(/á/g, 'a')
            .replace(/ß/g, 'ss')
            .trim();
    }

    function checkAnswer(selectedOpt = null) {
        if (awaitingNext) return;
        let qData = activeQuestions[currentIndex];
        let userAnswer = selectedOpt !== null ? selectedOpt : document.getElementById("geo-answer").value;
        
        let normUser = normalizeStr(userAnswer);

        if (normUser === "42") {
            let feedback = document.getElementById("geo-feedback");
            feedback.style.color = "#d69e2e";
            feedback.textContent = "🌌 42 ist die Antwort auf alles.... Aber hier suchen wir etwas anderes...";
            document.getElementById("geo-answer").value = "";
            return;
        }

        if (!sessionStats[qData.cat]) sessionStats[qData.cat] = { total: 0, correct: 0 };
        sessionStats[qData.cat].total++;

        let normCorrect = normalizeStr(qData.answer);
        let isCorrect = false;

        let userParts = userAnswer.split(/,|\/|\+|&|\bund\b|\boder\b/i).map(p => normalizeStr(p));
        if (userParts.some(part => part.length > 0 && normCorrect.includes(part))) {
            isCorrect = true;
        }
        if (normUser === normCorrect) {
            isCorrect = true;
        }

        document.getElementById("input-row").style.display = "none";
        document.getElementById("check-btn").style.display = "none";
        document.getElementById("mc-container").style.display = "none";

        if (isCorrect) {
            sessionStats[qData.cat].correct++;
            document.getElementById("geo-feedback").style.color = "green";
            document.getElementById("geo-feedback").textContent = "Richtig! Super gemacht! 🌟";

            setTimeout(() => {
                currentIndex++;
                loadQuestion();
            }, 1200);
        } else {
            awaitingNext = true;
            if (qData.retryCount === 0) {
                qData.retryCount++;
                activeQuestions.push(qData);
                document.getElementById("total-q-num").textContent = activeQuestions.length;
                document.getElementById("geo-feedback").style.color = "red";
                document.getElementById("geo-feedback").textContent = `Leider falsch. Richtig wäre: ${qData.answer} (Die Frage kommt am Ende noch einmal!)`;
            } else {
                document.getElementById("geo-feedback").style.color = "red";
                document.getElementById("geo-feedback").textContent = `Leider falsch. Richtig wäre: ${qData.answer} (Endgültig beendet für diese Runde).`;
            }
            document.getElementById("next-btn").style.display = "block";
        }
    }

    function proceedNext() {
        currentIndex++;
        loadQuestion();
    }

    function exportCSVStats() {
        let pass = prompt("Bitte Eltern-Passwort eingeben (Chef):");
        if (pass !== "47110815") {
            alert("Falsches Passwort!");
            return;
        }

        let csvContent = "data:text/csv;charset=utf-8,Kategorie;Erkannte_Fragen;Gesamt_Fragen;Erkennungsrate\n";
        for (let cat in sessionStats) {
            let s = sessionStats[cat];
            let rate = s.total > 0 ? Math.round((s.correct / s.total) * 100) + "%" : "0%";
            csvContent += `${cat};${s.correct};${s.total};${rate}\n`;
        }

        let encodedUri = encodeURI(csvContent);
        let link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", "Geografie_Lernstatistik.csv");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    window.addEventListener("beforeunload", function (e) {
        console.log("Sitzung beendet - Statistik aktualisiert.");
    });
</script>

</body>
</html>
