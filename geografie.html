<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Europa-Geografie Prüfungstrainer</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0f4f8; margin: 0; padding: 15px; display: flex; justify-content: center; }
        .container { background: white; width: 100%; max-width: 750px; padding: 20px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); text-align: center; }
        h1 { color: #d69e2e; margin-top: 5px; font-size: 1.4rem; }
        
        .setup-box { background: #ebf8ff; padding: 20px; border-radius: 12px; margin-bottom: 15px; text-align: left; }
        .setup-group { margin-bottom: 12px; }
        label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 0.9rem; color: #2b6cb0; }
        select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #cbd5e0; box-sizing: border-box; }

        .map-wrapper {
            position: relative;
            width: 100%;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            margin-bottom: 15px;
            overflow: hidden;
            background: #cbd5e0;
            display: none;
        }
        .map-wrapper img { width: 100%; height: auto; display: block; }

        .stats-bar { font-size: 0.95rem; color: #4a5568; margin-bottom: 10px; font-weight: bold; display: flex; justify-content: space-between; background: #edf2f7; padding: 8px 12px; border-radius: 6px; }
        .question-box { background: #fefcbf; padding: 15px; border-radius: 10px; font-size: 1.1rem; font-weight: bold; margin-bottom: 15px; color: #744210; display: none; position: relative; padding-right: 60px; }
        
        /* Glühbirnen-Button für Tipps */
        .bulb-btn {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: white;
            border: 2px solid #d69e2e;
            border-radius: 50%;
            width: 38px;
            height: 38px;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: all 0.2s;
        }
        .bulb-btn:hover { background: #fffaf0; transform: translateY(-50%) scale(1.05); }

        /* Totenkopf-Notaus-Button */
        .skull-btn {
            position: absolute;
            right: 60px;
            top: 50%;
            transform: translateY(-50%);
            background: white;
            border: 2px solid #e53e3e;
            border-radius: 50%;
            width: 38px;
            height: 38px;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: all 0.2s;
        }
        .skull-btn:hover { background: #fff5f5; transform: translateY(-50%) scale(1.05); }

        input[type="text"] { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #cbd5e0; box-sizing: border-box; margin-bottom: 12px; font-size: 1rem; display: none; }
        .mc-grid { display: grid; gap: 10px; margin-bottom: 15px; display: none; }
        .mc-btn { background: white; border: 2px solid #cbd5e0; padding: 12px; border-radius: 8px; font-size: 1rem; cursor: pointer; font-weight: 500; text-align: left; }
        .mc-btn:hover { border-color: #d69e2e; background: #fffaf0; }

        .action-btn { background: #d69e2e; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem; margin-top: 5px; }
        .action-btn:hover { background: #b7791f; }
        .next-btn { background: #3182ce; display: none; }
        .next-btn:hover { background: #2b6cb0; }

        .tip-box { background: #fffaf0; border: 1px dashed #d69e2e; padding: 12px; border-radius: 8px; font-size: 0.95rem; color: #744210; margin-bottom: 12px; text-align: left; display: none; }
    </style>
</head>
<body>

<div class="container">
    <div style="text-align: left;"><a href="index.html">⬅ Zurück zum Menü</a></div>
    <h1>🌍 Europa-Geografie Prüfungstrainer</h1>

    <div id="setup-screen" class="setup-box">
        <h3>Prüfungsvorbereitung konfigurieren:</h3>
        
        <div class="setup-group">
            <label>Schwierigkeitsstufe & Karte:</label>
            <select id="difficulty-level">
                <option value="adaptive">⚡ Adaptiv (Startet Stufe 1, steigt bei Erfolg auf!)</option>
                <option value="1">Stufe 1: Multiple Choice (Mit Pin-Karte)</option>
                <option value="2" selected>Stufe 2: Texteingabe mit Pin-Nummer</option>
                <option value="3">Stufe 3: Experten-Modus (Stumme Karte)</option>
            </select>
        </div>

        <div class="setup-group">
            <label>Fragetyp:</label>
            <select id="train-topic">
                <option value="mixed">Gemischt (Hauptstadt zu Punkt & Land zu Punkt)</option>
                <option value="capital_by_point">Nur Hauptstadt zu Punkt suchen</option>
                <option value="country_by_point">Nur Land zu Punkt suchen</option>
            </select>
        </div>

        <div class="setup-group">
            <label>Anzahl der Fragen:</label>
            <select id="question-limit">
                <option value="5">5 Fragen</option>
                <option value="10" selected>10 Fragen</option>
                <option value="all">Alle verfügbaren Fragen</option>
            </select>
        </div>

        <button class="action-btn" onclick="startTraining()">Training starten 🚀</button>
    </div>

    <div class="stats-bar" id="stats-bar" style="display: none;">
        <span>Frage <span id="current-q-num">1</span> von <span id="total-q-num">0</span></span>
        <span>Stufe: <span id="current-level-display">1</span></span>
    </div>

    <div class="map-wrapper" id="map-wrapper">
        <img id="geo-map-img" src="regionen_pin_europa.png" alt="Europakarte" onerror="this.src='https://upload.wikimedia.org/wikipedia/commons/thumb/b/b5/Europe_blank_map.png/800px-Europe_blank_map.png'">
    </div>

    <div class="question-box" id="geo-question">
        <span id="question-text">Fragetext</span>
        <!-- Notaus-Knopf ☠️ -->
        <button class="skull-btn" onclick="endSessionEarly()" title="Runde sofort beenden (Notaus)">☠️</button>
        <!-- Glühbirnen-Button 💡 -->
        <button class="bulb-btn" onclick="showNextTip()" title="Tipp anzeigen">💡</button>
    </div>
    <div id="geo-tip" class="tip-box"></div>

    <input type="text" id="geo-answer" placeholder="Antwort eingeben..." onkeypress="if(event.key === 'Enter') checkAnswer()">
    <button class="action-btn" id="check-btn" style="display: none;" onclick="checkAnswer()">Antwort prüfen</button>
    
    <button class="action-btn next-btn" id="next-btn" onclick="proceedNext()">Weiter zur nächsten Frage ➡️</button>

    <div class="mc-grid" id="mc-container"></div>
    <p id="geo-feedback" style="font-weight: bold; margin-top: 12px;"></p>
</div>

<script src="daten.js"></script>
<script>
    let activeQuestions = [];
    let currentIndex = 0;
    let selectedLevelSetting = "adaptive";
    let currentActiveLevel = 2;
    let awaitingNext = false;

    function startTraining() {
        selectedLevelSetting = document.getElementById("difficulty-level").value;
        currentActiveLevel = (selectedLevelSetting === "adaptive") ? 1 : parseInt(selectedLevelSetting);
        
        let topic = document.getElementById("train-topic").value;
        let limitVal = document.getElementById("question-limit").value;

        let generatedPool = [];
        europaDatenbank.forEach(item => {
            if (topic === "mixed" || topic === "capital_by_point") {
                generatedPool.push({ type: "capital", item: item, answer: item.hauptstadt, prompt: `Nenne die Hauptstadt von Punkt ${item.nr}.`, retryCount: 0 });
            }
            if (topic === "mixed" || topic === "country_by_point") {
                generatedPool.push({ type: "country", item: item, answer: item.land, prompt: `Welches Land liegt bei Punkt ${item.nr}?`, retryCount: 0 });
            }
        });

        generatedPool.sort(() => Math.random() - 0.5);
        let limit = limitVal === "all" ? generatedPool.length : parseInt(limitVal);
        activeQuestions = generatedPool.slice(0, Math.min(limit, generatedPool.length));

        activeQuestions.forEach(q => {
            q.tipPool = buildTipPool(q.item, q.type);
            q.tipIndex = 0;
            q.retryCount = 0;
        });

        if (activeQuestions.length === 0) return;

        document.getElementById("setup-screen").style.display = "none";
        document.getElementById("stats-bar").style.display = "flex";
        document.getElementById("map-wrapper").style.display = "block";
        document.getElementById("geo-question").style.display = "block";

        currentIndex = 0;
        awaitingNext = false;
        loadQuestion();
    }

    function buildTipPool(item, qType) {
        let rawTips = [];
        if (qType === "capital") {
            rawTips.push(`Das Land zu Punkt ${item.nr} ist: ${item.land}`);
        } else {
            rawTips.push(`Die Hauptstadt von Punkt ${item.nr} ist: ${item.hauptstadt}`);
        }

        if (item.tipp) rawTips.push(item.tipp);
        if (item.region) rawTips.push(`Gehört zur Region: ${item.region}`);
        
        if (typeof gebirgeDatenbank !== 'undefined') {
            let gebirge = gebirgeDatenbank.filter(g => g.laender && g.laender.includes(item.land));
            if (gebirge.length > 0) rawTips.push("Liegt im Gebirge: " + gebirge.map(g => g.name).join(", "));
        }

        if (rawTips.length === 0) rawTips.push("Kein weiterer Hinweis verfügbar.");
        rawTips.sort(() => Math.random() - 0.5);
        return rawTips;
    }

    function loadQuestion() {
        awaitingNext = false;
        document.getElementById("next-btn").style.display = "none";
        document.getElementById("check-btn").style.display = "block";

        if (currentIndex >= activeQuestions.length) {
            showEndScreen("🎉 Richtig stark! Du hast diese Prüfungsrunde abgeschlossen!");
            return;
        }

        let qData = activeQuestions[currentIndex];
        document.getElementById("current-q-num").textContent = currentIndex + 1;
        document.getElementById("total-q-num").textContent = activeQuestions.length;
        document.getElementById("current-level-display").textContent = currentActiveLevel;

        let mapImg = document.getElementById("geo-map-img");
        mapImg.src = (currentActiveLevel === 3) ? "Regionen_europa.png" : "regionen_pin_europa.png";

        document.getElementById("question-text").textContent = qData.prompt;
        document.getElementById("geo-tip").style.display = "none";
        document.getElementById("geo-tip").textContent = "";
        document.getElementById("geo-feedback").textContent = "";

        if (currentActiveLevel === 1) {
            document.getElementById("mc-container").style.display = "grid";
            document.getElementById("geo-answer").style.display = "none";
            document.getElementById("check-btn").style.display = "none";
            renderMultipleChoice(qData);
        } else {
            document.getElementById("mc-container").style.display = "none";
            document.getElementById("geo-answer").style.display = "block";
            document.getElementById("check-btn").style.display = "block";
            document.getElementById("geo-answer").value = "";
            document.getElementById("geo-answer").focus();
        }
    }

    function showEndScreen(titleText) {
        document.getElementById("geo-question").style.display = "none";
        document.getElementById("geo-tip").style.display = "none";
        document.getElementById("geo-answer").style.display = "none";
        document.getElementById("check-btn").style.display = "none";
        document.getElementById("next-btn").style.display = "none";
        document.getElementById("mc-container").style.display = "none";
        document.getElementById("map-wrapper").style.display = "none";
        document.getElementById("stats-bar").style.display = "none";
        
        let container = document.querySelector(".container");
        let endMsg = document.createElement("div");
        endMsg.innerHTML = `<h2>${titleText}</h2><button class='action-btn' onclick='location.reload()'>Neue Runde starten 🔄</button>`;
        container.appendChild(endMsg);
    }

    // ☠️ Notaus-Funktion: Runde sofort beenden
    function endSessionEarly() {
        if (confirm("Runde wirklich vorzeitig beenden?")) {
            showEndScreen("☠️ Runde vorzeitig beendet! Kopf hoch, beim nächsten Mal sitzt es!");
        }
    }

    function showNextTip() {
        let qData = activeQuestions[currentIndex];
        let tipBox = document.getElementById("geo-tip");
        if (!qData.tipPool || qData.tipPool.length === 0) return;

        tipBox.style.display = "block";
        tipBox.textContent = `💡 Tipp ${qData.tipIndex + 1} von ${qData.tipPool.length}: ${qData.tipPool[qData.tipIndex]}`;

        qData.tipIndex++;
        if (qData.tipIndex >= qData.tipPool.length) qData.tipIndex = 0;
    }

    function renderMultipleChoice(qData) {
        const mcContainer = document.getElementById("mc-container");
        mcContainer.innerHTML = "";

        let options = [qData.answer];
        while (options.length < 4) {
            let randomItem = europaDatenbank[Math.floor(Math.random() * europaDatenbank.length)];
            let val = qData.type === "capital" ? randomItem.hauptstadt : randomItem.land;
            if (!options.includes(val)) options.push(val);
        }
        options.sort(() => Math.random() - 0.5);

        options.forEach(opt => {
            let btn = document.createElement("button");
            btn.className = "mc-btn";
            btn.textContent = opt;
            btn.onclick = () => checkAnswer(opt);
            mcContainer.appendChild(btn);
        });
    }

    function normalizeStr(str) {
        return str.toLowerCase()
            .replace(/ä/g, 'a').replace(/ö/g, 'o').replace(/ü/g, 'u')
            .replace(/é/g, 'e').replace(/í/g, 'i').replace(/á/g, 'a')
            .replace(/ß/g, 'ss')
            .trim();
    }

    function getSimilarity(s1, s2) {
        let longer = s1; let shorter = s2;
        if (s1.length < s2.length) { longer = s2; shorter = s1; }
        let longerLength = longer.length;
        if (longerLength === 0) return 1.0;
        return (longerLength - editDistance(longer, shorter)) / parseFloat(longerLength);
    }

    function editDistance(s1, s2) {
        s1 = s1.toLowerCase(); s2 = s2.toLowerCase();
        let costs = new Array();
        for (let i = 0; i <= s1.length; i++) {
            let lastValue = i;
            for (let j = 0; j <= s2.length; j++) {
                if (i === 0) { costs[j] = j; }
                else {
                    if (j > 0) {
                        let newValue = costs[j - 1];
                        if (s1.charAt(i - 1) !== s2.charAt(j - 1)) {
                            newValue = Math.min(Math.min(newValue, lastValue), costs[j]) + 1;
                        }
                        costs[j - 1] = lastValue; lastValue = newValue;
                    }
                }
            }
            if (i > 0) { costs[s2.length] = lastValue; }
        }
        return costs[s2.length];
    }

    function checkAnswer(selectedOpt = null) {
        if (awaitingNext) return;
        let qData = activeQuestions[currentIndex];
        let userAnswer = selectedOpt !== null ? selectedOpt : document.getElementById("geo-answer").value;
        
        let normUser = normalizeStr(userAnswer);
        let normCorrect = normalizeStr(qData.answer);

        let similarity = getSimilarity(normUser, normCorrect);
        let isCorrect = (normUser === normCorrect || similarity >= 0.7);

        document.getElementById("geo-answer").style.display = "none";
        document.getElementById("check-btn").style.display = "none";
        document.getElementById("mc-container").style.display = "none";

        if (isCorrect) {
            document.getElementById("geo-feedback").style.color = "green";
            document.getElementById("geo-feedback").textContent = "Richtig! Super gemacht! 🌟";

            if (selectedLevelSetting === "adaptive" && currentActiveLevel < 3) {
                currentActiveLevel++;
            }

            setTimeout(() => {
                currentIndex++;
                loadQuestion();
            }, 1200);
        } else {
            awaitingNext = true;
            
            if (qData.retryCount === 0) {
                qData.retryCount++;
                activeQuestions.push(qData);
                document.getElementById("total-q-num").textContent = activeQuestions.length;
                document.getElementById("geo-feedback").style.color = "red";
                document.getElementById("geo-feedback").textContent = `Leider falsch. Richtig wäre: ${qData.answer} (Die Frage kommt am Ende noch einmal!)`;
            } else {
                document.getElementById("geo-feedback").style.color = "red";
                document.getElementById("geo-feedback").textContent = `Leider falsch. Richtig wäre: ${qData.answer} (Endgültig beendet für diese Runde).`;
            }

            document.getElementById("next-btn").style.display = "block";
            
            if (selectedLevelSetting === "adaptive") {
                currentActiveLevel = Math.max(1, currentActiveLevel - 1);
            }
        }
    }

    function proceedNext() {
        currentIndex++;
        loadQuestion();
    }
</script>

</body>
</html>
