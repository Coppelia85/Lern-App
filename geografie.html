<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Europa-Geografie Prüfungstrainer</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0f4f8; margin: 0; padding: 10px; display: flex; justify-content: center; }
        .container { background: white; width: 100%; max-width: 750px; padding: 15px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); text-align: center; box-sizing: border-box; }
        h1 { color: #d69e2e; margin-top: 5px; font-size: 1.3rem; }
        
        .setup-box { background: #ebf8ff; padding: 15px; border-radius: 12px; margin-bottom: 15px; text-align: left; }
        .setup-group { margin-bottom: 10px; }
        label { display: block; font-weight: 600; margin-bottom: 4px; font-size: 0.85rem; color: #2b6cb0; }
        select { width: 100%; padding: 8px; border-radius: 8px; border: 1px solid #cbd5e0; box-sizing: border-box; background: white; }

        .map-wrapper { position: relative; width: 100%; border: 2px solid #e2e8f0; border-radius: 10px; margin-bottom: 12px; overflow: hidden; background: #cbd5e0; display: none; }
        .map-wrapper img { width: 100%; height: auto; display: block; }

        .stats-bar { font-size: 0.85rem; color: #4a5568; margin-bottom: 8px; font-weight: bold; display: flex; justify-content: space-between; background: #edf2f7; padding: 6px 10px; border-radius: 6px; }
        .question-box { background: #fefcbf; padding: 12px; border-radius: 10px; font-size: 1rem; font-weight: bold; margin-bottom: 12px; color: #744210; display: none; }
        
        .input-row { display: none; gap: 8px; margin-bottom: 10px; align-items: center; }
        input[type="text"] { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #cbd5e0; font-size: 1rem; box-sizing: border-box; }
        
        .action-btn { background: #d69e2e; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem; margin-top: 5px; }
        .action-btn:hover { background: #b7791f; }
        .next-btn { background: #3182ce; display: none; }
    </style>
</head>
<body>

<div class="container">
    <div style="text-align: left;"><a href="index.html">⬅ Zurück zum Menü</a></div>
    <h1>🌍 Europa-Geografie Prüfungstrainer</h1>

    <div id="setup-screen" class="setup-box">
        <h3>Prüfungsvorbereitung konfigurieren:</h3>
        
        <div class="setup-group">
            <label>Themenbereich:</label>
            <select id="train-topic">
                <option value="europa_mix">Städte & Länder</option>
                <option value="nachlaender">Nachbarländer von Deutschland</option>
                <option value="fluesse">Flüsse in Europa</option>
                <option value="gebirge">Gebirge in Europa</option>
                <option value="meere">Meere & Ozeane</option>
                <option value="inseln">Inseln & Halbinseln</option>
                <option value="verdichtung">Verdichtungsräume</option>
            </select>
        </div>

        <div class="setup-group">
            <label>Anzahl der Fragen:</label>
            <select id="question-limit">
                <option value="5">5 Fragen</option>
                <option value="10" selected>10 Fragen</option>
                <option value="all">Alle verfügbaren</option>
            </select>
        </div>

        <button class="action-btn" onclick="startGeografieTraining()">Training starten 🚀</button>
    </div>

    <div class="stats-bar" id="stats-bar" style="display: none;">
        <span>Frage <span id="current-q-num">1</span>/<span id="total-q-num">0</span></span>
        <span>⚡ XP: <span id="user-xp">0</span></span>
    </div>

    <div class="map-wrapper" id="map-wrapper">
        <img id="geo-map-img" src="regionen_pin_europa.png" alt="Europakarte">
    </div>

    <div class="question-box" id="geo-question">
        <span id="question-text">Fragetext</span>
    </div>

    <div class="input-row" id="input-row">
        <input type="text" id="geo-answer" placeholder="Antwort eingeben..." onkeypress="if(event.key === 'Enter') checkGeoAnswer()">
        <button class="action-btn" onclick="checkGeoAnswer()" style="width: auto; margin:0;">Prüfen</button>
    </div>

    <button class="action-btn next-btn" id="next-btn" onclick="proceedGeoNext()">Weiter ➡️</button>

    <p id="geo-feedback" style="font-weight: bold; margin-top: 10px;"></p>
</div>

<script src="geografie_daten.js"></script>
<script>
    let activeQuestions = [];
    let currentIndex = 0;
    let geoXP = parseInt(localStorage.getItem("geo_user_xp") || "0");

    function updateGeoXP() {
        let el = document.getElementById("user-xp");
        if(el) el.textContent = geoXP;
    }

    function startGeografieTraining() {
        // Sicherheitscheck, ob die geografie_daten.js da ist
        if (typeof europaDatenbank === 'undefined') {
            alert("Fehler: geografie_daten.js wurde nicht gefunden oder geladen!");
            return;
        }

        let topicKey = document.getElementById("train-topic").value;
        let limitVal = document.getElementById("question-limit").value;
        let generatedPool = [];

        if (topicKey === "europa_mix") {
            europaDatenbank.forEach(item => {
                generatedPool.push({ prompt: `Was ist die Hauptstadt von ${item.land}?`, answer: item.hauptstadt, synonyms: item.synonymeHauptstadt || [] });
            });
        } else if (topicKey === "nachlaender" && typeof nachlaenderDatenbank !== 'undefined') {
            nachlaenderDatenbank.forEach(n => {
                generatedPool.push({ prompt: `Nenne ein Nachbarland von Deutschland:`, answer: n.land, synonyms: n.synonyme || [] });
            });
        } else if (topicKey === "fluesse" && typeof fluesseDatenbank !== 'undefined') {
            fluesseDatenbank.forEach(f => {
                generatedPool.push({ prompt: `Welcher Fluss fließt: ${f.route}?`, answer: f.name, synonyms: f.synonyme || [] });
            });
        } else if (topicKey === "gebirge" && typeof gebirgeDatenbank !== 'undefined') {
            gebirgeDatenbank.forEach(g => {
                generatedPool.push({ prompt: `Welches Gebirge liegt in ${g.laender[0]}?`, answer: g.name, synonyms: g.synonyme || [] });
            });
        } else if (topicKey === "meere" && typeof meereDatenbank !== 'undefined') {
            meereDatenbank.forEach(m => {
                generatedPool.push({ prompt: `Welches Meer liegt hier: ${m.lage}?`, answer: m.name, synonyms: [] });
            });
        } else if (topicKey === "inseln" && typeof inselnDatenbank !== 'undefined') {
            inselnDatenbank.forEach(i => {
                generatedPool.push({ prompt: `Welche Insel / Halbinsel gehört zu ${i.bezug || 'Europa'}?`, answer: i.name, synonyms: [] });
            });
        } else if (topicKey === "verdichtung" && typeof verdichtungsraeumeDatenbank !== 'undefined') {
            verdichtungsraeumeDatenbank.forEach(v => {
                generatedPool.push({ prompt: `Welcher Verdichtungsraum hat wichtige Städte wie ${v.städte[0]}?`, answer: v.name, synonyms: [] });
            });
        }

        generatedPool.sort(() => Math.random() - 0.5);
        let limit = limitVal === "all" ? generatedPool.length : parseInt(limitVal);
        activeQuestions = generatedPool.slice(0, Math.min(limit, generatedPool.length));

        if (activeQuestions.length === 0) {
            alert("Keine Fragen für diesen Bereich gefunden!");
            return;
        }

        updateGeoXP();
        document.getElementById("setup-screen").style.display = "none";
        document.getElementById("stats-bar").style.display = "flex";
        document.getElementById("map-wrapper").style.display = "block";
        document.getElementById("geo-question").style.display = "block";

        currentIndex = 0;
        loadGeoQuestion();
    }

    function loadGeoQuestion() {
        document.getElementById("next-btn").style.display = "none";
        document.getElementById("input-row").style.display = "flex";

        if (currentIndex >= activeQuestions.length) {
            showGeoEndScreen(`🎉 Geografie-Runde beendet!<br><br>⚡ Geografie-XP: ${geoXP}`);
            return;
        }

        let qData = activeQuestions[currentIndex];
        document.getElementById("question-text").textContent = qData.prompt;
        document.getElementById("current-q-num").textContent = currentIndex + 1;
        document.getElementById("total-q-num").textContent = activeQuestions.length;

        document.getElementById("geo-feedback").textContent = "";
        let ansInput = document.getElementById("geo-answer");
        ansInput.value = "";
        ansInput.focus();
    }

    function checkGeoAnswer() {
        let qData = activeQuestions[currentIndex];
        let userAnswer = document.getElementById("geo-answer").value.trim().toLowerCase();
        let allValid = [qData.answer, ...(qData.synonyms || [])].map(s => s.toLowerCase());

        document.getElementById("input-row").style.display = "none";

        if (allValid.includes(userAnswer)) {
            geoXP += 1;
            localStorage.setItem("geo_user_xp", geoXP);
            updateGeoXP();

            document.getElementById("geo-feedback").style.color = "green";
            document.getElementById("geo-feedback").textContent = "Richtig! +1 XP 🌟";

            setTimeout(() => {
                currentIndex++;
                loadGeoQuestion();
            }, 1000);
        } else {
            document.getElementById("geo-feedback").style.color = "red";
            document.getElementById("geo-feedback").textContent = `Leider falsch. Richtig wäre: ${qData.answer}`;
            document.getElementById("next-btn").style.display = "block";
        }
    }

    function proceedGeoNext() {
        currentIndex++;
        loadGeoQuestion();
    }

    function showGeoEndScreen(msg) {
        document.querySelector(".container").innerHTML = `<h2>${msg}</h2><button class='action-btn' onclick='location.reload()'>Neue Runde 🔄</button><br><br><a href="index.html">⬅ Zurück zum Menü</a>`;
    }
</script>

</body>
</html>
