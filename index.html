<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lern-App Zentrale</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f7fafc;
            color: #2d3748;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        h1 {
            color: #2b6cb0;
            font-size: 1.5rem;
            margin-bottom: 5px;
        }
        .subtitle {
            font-size: 0.9rem;
            color: #718096;
            margin-bottom: 25px;
        }
        .profile-box {
            background: #edf2f7;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 25px;
            text-align: left;
        }
        .profile-box label {
            display: block;
            font-size: 0.85rem;
            font-weight: bold;
            color: #4a5568;
            margin-bottom: 5px;
        }
        .profile-select {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #cbd5e0;
            font-size: 1rem;
            background: white;
        }
        .menu-btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border-radius: 10px;
            border: 2px solid #3182ce;
            background: white;
            color: #3182ce;
            font-size: 1rem;
            font-weight: bold;
            text-decoration: none;
            transition: all 0.2s;
            box-sizing: border-box;
        }
        .menu-btn:hover {
            background: #3182ce;
            color: white;
        }
        /* Chef-Statistik Box */
        #chef-stats-section {
            margin-top: 25px;
            background: #fff5f5;
            border: 2px solid #fc8181;
            padding: 15px;
            border-radius: 12px;
            display: none;
            text-align: left;
        }
        #chef-stats-section h3 {
            color: #c53030;
            margin-top: 0;
            font-size: 1.1rem;
        }
        .stat-item {
            background: white;
            margin-bottom: 8px;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #feb2b2;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🚀 Lern-App Zentrale</h1>
        <div class="subtitle">Willkommen! Wer trainiert heute?</div>

        <!-- Profil Auswahl -->
        <div class="profile-box">
            <label for="current-user-select">Aktuelles Profil:</label>
            <select id="current-user-select" class="profile-select" onchange="handleUserChange()">
                <option value="King Knulwes">👑 King Knulwes</option>
                <option value="Mini 14">👦 Mini 14</option>
                <option value="Queen Katherine">👸 Queen Katherine</option>
                <option value="Chef">⭐ Chef (Lehrer/Admin)</option>
            </select>
        </div>

        <!-- Navigation zu den Lerneinheiten -->
        <a href="geografie.html" class="menu-btn">🌍 Europa-Geografie Prüfungstrainer</a>
        <a href="vokabel.html" class="menu-btn" style="border-color: #4299e1; color: #4299e1;">📖 Vokabel- & Sprachen-Trainer</a>

        <!-- Chef-Statistik & Auswertung (Nur sichtbar bei Profil "Chef") -->
        <div id="chef-stats-section">
            <h3>👑 Chef-Statistik & Auswertung</h3>
            <p style="font-size: 0.85rem; color: #718096; margin-bottom: 10px;">Übersicht der Lernfortschritte aller Profile:</p>
            <div id="chef-stats-list">
                <!-- Wird dynamisch gefüllt -->
            </div>
        </div>
    </div>

    <script>
        function handleUserChange() {
            let selectedUser = document.getElementById("current-user-select").value;
            // Profil im localStorage speichern, damit die Unterseiten wissen, wer eingeloggt ist
            localStorage.setItem("active_user", selectedUser);
            
            let chefBox = document.getElementById("chef-stats-section");
            
            if (selectedUser === "Chef") {
                chefBox.style.display = "block";
                loadChefData();
            } else {
                chefBox.style.display = "none";
            }
        }

        function loadChefData() {
            let listEl = document.getElementById("chef-stats-list");
            listEl.innerHTML = "";
            
            let profiles = ["King Knulwes", "Mini 14", "Queen Katherine"];
            
            profiles.forEach(profile => {
                // XP für das jeweilige Profil auslesen
                let xpGeo = localStorage.getItem("geo_user_xp_" + profile) || localStorage.getItem("geo_user_xp") || "0";
                
                let div = document.createElement("div");
                div.className = "stat-item";
                div.innerHTML = `<strong>🌟 ${profile}</strong> <span>Geografie XP: <strong>${xpGeo}</strong></span>`;
                listEl.appendChild(div);
            });
        }

        // Beim Laden der Seite prüfen, ob ein Benutzer vorausgewählt war
        window.onload = function() {
            let savedUser = localStorage.getItem("active_user");
            if (savedUser) {
                let selectEl = document.getElementById("current-user-select");
                selectEl.value = savedUser;
            }
            handleUserChange();
        };
    </script>

</body>
</html>
