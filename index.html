<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lernstudio Hauptmenü</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0f4f8; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: white; width: 100%; max-width: 500px; padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); text-align: center; }
        h1 { color: #2b6cb0; margin-bottom: 10px; }
        .profile-box { background: #ebf8ff; padding: 15px; border-radius: 10px; margin-bottom: 25px; }
        select, input, button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 8px; font-size: 1rem; border: 1px solid #cbd5e0; box-sizing: border-box; }
        button { background: #2b6cb0; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:hover { background: #2c5282; }
        .menu-grid { display: grid; gap: 15px; margin-top: 20px; }
        .menu-btn { background: #38a169; display: block; text-decoration: none; color: white; padding: 15px; border-radius: 10px; font-weight: bold; }
        .menu-btn:hover { background: #2f855a; }
        #auth-modal { display: none; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎓 Lernstudio</h1>
    <p>Wähle dein Profil, um zu starten:</p>

    <div class="profile-box">
        <label for="user-select"><b>Wer lernt gerade?</b></label>
        <select id="user-select" onchange="checkUserAuth()">
            <!-- Wird dynamisch aus daten.js geladen -->
        </select>
        
        <div id="auth-modal">
            <input type="password" id="password-input" placeholder="Passwort eingeben...">
            <button onclick="verifyPassword()">Einloggen</button>
        </div>
    </div>

    <div id="main-menu" style="display: none;">
        <h3 id="welcome-msg" style="color: #38a169;"></h3>
        <div class="menu-grid">
            <a href="vokabeln.html" class="menu-btn">📖 Vokabel-Trainer (Hierarchie)</a>
            <a href="geografie.html" class="menu-btn" style="background: #d69e2e;">🌍 Geografie-Europa-Trainer</a>
        </div>
        
        <div style="margin-top: 30px; background: #f7fafc; padding: 15px; border-radius: 8px; text-align: left;">
            <h4>📊 Deine Statistiken</h4>
            <p id="stat-vocab">Vokabeln gelernt: 0</p>
            <p id="stat-geo">Geografie gelöst: 0</p>
        </div>
    </div>
</div>

<!-- WICHTIG: daten.js muss als Erstes geladen werden, damit die Config da ist! -->
<script src="daten.js"></script>
<script>
    const userSelect = document.getElementById("user-select");
    const authModal = document.getElementById("auth-modal");
    const mainMenu = document.getElementById("main-menu");
    const welcomeMsg = document.getElementById("welcome-msg");
    const passwordInput = document.getElementById("password-input");

    function initUsers() {
        userSelect.innerHTML = '<option value="">-- Bitte wählen --</option>';
        for (let user in userConfig) {
            let opt = document.createElement("option");
            opt.value = user;
            opt.textContent = user;
            userSelect.appendChild(opt);
        }
    }

    function checkUserAuth() {
        const selectedUser = userSelect.value;
        if (!selectedUser) {
            authModal.style.display = "none";
            mainMenu.style.display = "none";
            return;
        }

        const pwd = userConfig[selectedUser].passwort;
        if (pwd === "None") {
            loginSuccess(selectedUser);
        } else {
            authModal.style.display = "block";
            mainMenu.style.display = "none";
        }
    }

    function verifyPassword() {
        const selectedUser = userSelect.value;
        const enteredPwd = passwordInput.value;
        if (enteredPwd === userConfig[selectedUser].passwort) {
            loginSuccess(selectedUser);
        } else {
            alert("Falsches Passwort!");
        }
    }

    function loginSuccess(user) {
        authModal.style.display = "none";
        mainMenu.style.display = "block";
        welcomeMsg.textContent = `Willkommen zurück, ${user}! 🎉`;
        localStorage.setItem("activeUser", user);
        loadStats(user);
    }

    function loadStats(user) {
        let statsVocab = localStorage.getItem(`stats_vocab_${user}`) || 0;
        let statsGeo = localStorage.getItem(`stats_geo_${user}`) || 0;
        document.getElementById("stat-vocab").textContent = `Vokabeln gelernt: ${statsVocab}`;
        document.getElementById("stat-geo").textContent = `Geografie gelöst: ${statsGeo}`;
    }

    initUsers();
</script>

</body>
</html>
